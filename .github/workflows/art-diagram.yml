name: Render Art Management diagram
on:
  push:
    branches: [art-management-portfolio]
    paths:
      - '.github/workflows/art-diagram.yml'
      - 'projects/art-management/docs/class-diagram.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Render full-resolution PNG from native-export SVG
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.8.2
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='projects/art-management/docs/class-diagram.svg',
                           write_to='projects/art-management/docs/class-diagram.png',
                           scale=2)
          PY
          file projects/art-management/docs/class-diagram.png
      - name: Commit rendered PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/art-management/docs/class-diagram.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(art): add full-resolution PNG rendered from reviewed SVG"
            git push
          fi
